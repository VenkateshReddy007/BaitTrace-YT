<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaitTrace Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0a',
                        charcoal: '#111111',
                        amazon: '#FF9900',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-obsidian text-gray-200 font-sans min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="bg-charcoal border-b border-amazon/40 p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg class="w-6 h-6 text-amazon animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <h1 class="text-amazon text-2xl font-bold tracking-widest flex items-center gap-2">
                    BAITTRACE <span class="text-white opacity-80 text-lg font-medium">_SENSOR</span>
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-green-500 animate-ping"></span>
                <span class="text-xs font-mono text-gray-400 uppercase tracking-widest">Live Uplink</span>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 mt-4 space-y-6">

        <!-- Controls Form -->
        <div class="bg-charcoal p-6 rounded border border-amazon/30 shadow-md">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-xs font-bold text-amazon mb-1 uppercase tracking-wider">Target
                        Vector</label>
                    <select id="queryType"
                        class="w-full bg-obsidian border border-gray-700 text-white p-2.5 rounded text-sm outline-none focus:border-amazon transition">
                        <option value="ALL">ALL VECTORS</option>
                        <option value="LURE">LURES ONLY</option>
                        <option value="PARASITE">PARASITES ONLY</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-amazon mb-1 uppercase tracking-wider">Video Depth (Per
                        Query)</label>
                    <input type="number" id="limit" value="5" min="1" max="50"
                        class="w-full bg-obsidian border border-gray-700 text-white p-2.5 rounded text-sm outline-none focus:border-amazon transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-amazon mb-1 uppercase tracking-wider">Max Comments (Per
                        Video)</label>
                    <input type="number" id="maxComments" value="35" min="5" max="200"
                        class="w-full bg-obsidian border border-gray-700 text-white p-2.5 rounded text-sm outline-none focus:border-amazon transition">
                </div>
                <div>
                    <button onclick="triggerScan()"
                        class="w-full bg-amazon hover:bg-orange-500 text-obsidian font-bold py-2.5 px-6 rounded shadow-[0_0_15px_rgba(255,153,0,0.3)] hover:shadow-[0_0_25px_rgba(255,153,0,0.6)] transition-all uppercase tracking-wide flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Execute Sweep
                    </button>
                </div>
            </div>
        </div>

        <!-- Telemetry Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-charcoal p-6 rounded border-l-4 border-amazon shadow-md">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Videos Monitored</h3>
                <p id="metric-videos" class="text-4xl font-bold text-white font-mono">--</p>
            </div>
            <div class="bg-charcoal p-6 rounded border-l-4 border-amazon shadow-md">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Comments Parsed</h3>
                <p id="metric-comments" class="text-4xl font-bold text-white font-mono">--</p>
            </div>
            <div class="bg-charcoal p-6 rounded border-l-4 border-amazon shadow-md">
                <h3 class="text-amazon text-xs font-bold uppercase tracking-widest mb-2">Actionable Leads</h3>
                <p id="metric-leads" class="text-4xl font-bold text-white font-mono">--</p>
            </div>
        </div>

        <!-- Terminal Feed -->
        <div class="bg-[#050505] rounded border border-gray-800 shadow-inner overflow-hidden font-mono text-xs">
            <div
                class="p-2.5 border-b border-gray-800 flex justify-between items-center bg-charcoal text-amazon font-bold">
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-amazon"></span>
                    <span>TERMINAL FEED_</span>
                </div>
                <button onclick="document.getElementById('terminal-feed').innerHTML=''"
                    class="text-gray-400 hover:text-white transition text-[11px] uppercase tracking-wider">
                    [Clear]
                </button>
            </div>
            <div id="terminal-feed" class="p-4 h-64 overflow-y-auto text-green-400 whitespace-pre-wrap leading-relaxed">
                System initialized. Awaiting sweep parameters...
            </div>
        </div>

        <!-- Live Target Ledger -->
        <div class="bg-charcoal rounded border border-gray-800 overflow-hidden shadow-xl">
            <div class="p-4 border-b border-gray-800 bg-obsidian flex justify-between items-center">
                <h2 class="text-amazon font-bold uppercase tracking-widest text-sm flex items-center gap-2">
                    <svg class="w-4 h-4 text-amazon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                        </path>
                    </svg>
                    Live Target Ledger
                </h2>
                <span class="text-xs text-gray-500 font-mono">Auto-refreshes every 5s</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-[#0e0e0e] text-amazon text-xs uppercase tracking-wider border-b border-gray-800">
                            <th class="p-4 font-bold">Target (Direct Link)</th>
                            <th class="p-4 font-bold">Type / Intel</th>
                            <th class="p-4 font-bold">Fraud Vector</th>
                            <th class="p-4 font-bold">Origin Video</th>
                            <th class="p-4 font-bold text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body" class="divide-y divide-gray-800 text-xs">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let socket;
        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws/terminal`);

            socket.onopen = () => {
                const term = document.getElementById('terminal-feed');
                term.innerHTML = '<span class="text-green-400">🔗 Uplink established. Live stream ready.</span>\n';
            };

            socket.onmessage = (event) => {
                const term = document.getElementById('terminal-feed');
                term.textContent += event.data;
                term.scrollTop = term.scrollHeight;
            };

            socket.onclose = () => {
                setTimeout(connectWS, 3000);
            };

            socket.onerror = () => {
                socket.close();
            };
        }
        connectWS();

        async function fetchMetrics() {
            try {
                const res = await fetch('/api/metrics');
                const data = await res.json();
                document.getElementById('metric-videos').innerText = data.videos.toLocaleString();
                document.getElementById('metric-comments').innerText = data.comments.toLocaleString();
                document.getElementById('metric-leads').innerText = data.leads.toLocaleString();
            } catch (e) { }
        }

        async function fetchLeads() {
            try {
                const res = await fetch('/api/leads');
                const data = await res.json();
                const tbody = document.getElementById('leads-body');
                tbody.innerHTML = '';

                if (!data.leads || data.leads.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500 italic">No actionable leads harvested yet. Execute a sweep above to populate targets.</td></tr>`;
                    return;
                }

                data.leads.forEach(lead => {
                    const intel = lead.telegram_intel || {};
                    const isBroadcast = intel.entity_type === 'BROADCAST_CHANNEL';
                    const cleanTarget = (lead.target || '').replace('@', '').trim();
                    const tgUrl = lead.indicator_type === 'TELEGRAM' ? `https://t.me/${cleanTarget}` : '#';

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-[#151515] transition-colors';
                    tr.innerHTML = `
                        <td class="p-4 font-mono font-bold">
                            <a href="${tgUrl}" target="_blank" rel="noopener noreferrer" class="text-amazon hover:underline inline-flex items-center gap-1.5" title="Open in Telegram Web">
                                ${lead.target}
                                <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </a>
                        </td>
                        <td class="p-4">
                            <span class="px-2 py-0.5 text-[11px] font-bold uppercase rounded border ${isBroadcast ? 'border-blue-500/40 text-blue-400 bg-blue-500/10' : 'border-emerald-500/40 text-emerald-400 bg-emerald-500/10'}">
                                ${intel.entity_type || 'PROBING...'}
                            </span>
                            <p class="text-[11px] text-gray-400 mt-1 truncate max-w-xs" title="${intel.tg_bio || ''}">
                                ${intel.tg_title || ''}
                            </p>
                        </td>
                        <td class="p-4">
                            <span class="text-white font-medium">${lead.fraud_class.replace(/_/g, ' ')}</span>
                            <p class="text-[11px] text-gray-500 mt-0.5">Author: ${lead.author}</p>
                        </td>
                        <td class="p-4 max-w-xs">
                            <a href="${lead.source_url}" target="_blank" rel="noopener noreferrer" class="text-gray-300 hover:text-amazon truncate block underline" title="${lead.source_title}">
                                ${lead.source_title || 'View Video'}
                            </a>
                        </td>
                        <td class="p-4 text-right">
                            ${isBroadcast
                            ? `<button disabled class="px-3 py-1.5 bg-gray-800 text-gray-500 rounded text-xs font-bold cursor-not-allowed">MONITOR ONLY</button>`
                            : `<a href="${tgUrl}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded text-xs shadow-[0_0_10px_rgba(220,38,38,0.4)] transition inline-block">DISPATCH PERSONA</a>`
                        }
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) { }
        }

        async function triggerScan() {
            try {
                await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query_type: document.getElementById('queryType').value,
                        limit: parseInt(document.getElementById('limit').value),
                        max_comments: parseInt(document.getElementById('maxComments').value)
                    })
                });
            } catch (e) { }
        }

        setInterval(fetchMetrics, 5000);
        setInterval(fetchLeads, 5000);
        fetchMetrics();
        fetchLeads();
    </script>
</body>

</html>
